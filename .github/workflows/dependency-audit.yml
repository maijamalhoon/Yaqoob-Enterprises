name: Dependency Audit

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep high/critical findings in production dependencies as a blocking failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full-tree reports can contain upstream development-tool advisories with no patched
      # release. Keep the full result visible without letting an unfixable dev-only advisory
      # block unrelated product changes; Dependabot/GitHub dependency alerts remain enabled.
      - name: Report full dependency tree findings
        shell: bash
        run: |
          if npm audit --audit-level=high; then
            echo "Full dependency tree has no high/critical advisories."
          else
            echo "::warning::Full dependency tree reports high/critical advisories. Review the audit output and dependency alerts; this result is informational while an upstream development-tool fix is unavailable."
          fi
