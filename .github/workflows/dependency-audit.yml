name: Dependency Audit

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit dependencies for high and critical advisories
        run: npm audit --audit-level=high
