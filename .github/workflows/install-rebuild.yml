name: Install full-stack rebuild

on:
  push:
    branches:
      - agent/fullstack-admin-rebuild

permissions:
  contents: write

jobs:
  install-source:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Trigger source installation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fullstack-admin-rebuild
      - name: Reconstruct source archive
        run: |
          test -n "$(find .bootstrap/rebuild -name 'source.part-*' -print -quit)"
          mkdir -p /tmp/yaqoob-source
          cat .bootstrap/rebuild/source.part-* | base64 --decode > /tmp/yaqoob-source.tar.xz
          tar -xJf /tmp/yaqoob-source.tar.xz -C /tmp/yaqoob-source
          rsync -a --delete --exclude='.git' /tmp/yaqoob-source/ ./
      - name: Commit rebuilt application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild website and admin center"
          git push
