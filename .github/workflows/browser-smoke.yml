name: Browser Smoke

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build pull request application
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Start pull request production server
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm start > /tmp/yaqoob-next.log 2>&1 &
          echo $! > /tmp/yaqoob-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yaqoob-next.log
          exit 1

      - name: Run browser smoke
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || 'https://yaqoob-enterprises.vercel.app' }}
        run: node .github/scripts/browser-smoke.mjs

      - name: Show pull request server log on failure
        if: failure() && github.event_name == 'pull_request'
        run: cat /tmp/yaqoob-next.log || true
