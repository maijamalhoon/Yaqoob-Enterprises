name: Browser Smoke

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke
        env:
          BASE_URL: https://yaqoob-enterprises.vercel.app
        run: node .github/scripts/browser-smoke.mjs
