name: Browser Smoke

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build pull request application
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          VERCEL: "1"
        run: npm run build

      - name: Start pull request production server
        if: github.event_name == 'pull_request'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          VERCEL: "1"
        run: |
          nohup npm start > /tmp/yaqoob-next.log 2>&1 &
          echo $! > /tmp/yaqoob-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yaqoob-next.log
          exit 1

      - name: Run browser smoke
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3000' || 'https://yaqoob-enterprises.vercel.app' }}
        run: node .github/scripts/browser-smoke.mjs

      - name: Lab performance budget (mobile + desktop)
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node .github/scripts/performance-smoke.mjs

      - name: Show pull request server log on failure
        if: failure() && github.event_name == 'pull_request'
        run: cat /tmp/yaqoob-next.log || true

  outage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build with deliberately unreachable CMS (CI only)
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-unreachable-cms
          VERCEL: "1"
        run: npm run build

      - name: Start isolated production-mode server
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-unreachable-cms
          VERCEL: "1"
        run: |
          nohup npm start > /tmp/yaqoob-outage.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 /tmp/yaqoob-outage.log
          exit 1

      - name: Verify public customer journey with CMS offline
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node .github/scripts/outage-smoke.mjs

      - name: Show outage server log on failure
        if: failure()
        run: tail -n 120 /tmp/yaqoob-outage.log || true
